services:
  form-lab:
    build: .
    restart: unless-stopped
    init: true
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      FORM_LAB_ORIGIN: ${FORM_LAB_ORIGIN:?Set FORM_LAB_ORIGIN to your public HTTPS origin}
      FORM_LAB_REGISTRATION_ENABLED: ${FORM_LAB_REGISTRATION_ENABLED:-true}
      FORM_LAB_MAIL_TRANSPORT: ${FORM_LAB_MAIL_TRANSPORT:-disabled}
      FORM_LAB_MAIL_FROM: ${FORM_LAB_MAIL_FROM:-}
      FORM_LAB_MAILGUN_REGION: ${FORM_LAB_MAILGUN_REGION:-us}
      FORM_LAB_MAILGUN_DOMAIN: ${FORM_LAB_MAILGUN_DOMAIN:-}
      FORM_LAB_MAILGUN_API_KEY: ${FORM_LAB_MAILGUN_API_KEY:-}
      FORM_LAB_SMTP_HOST: ${FORM_LAB_SMTP_HOST:-}
      FORM_LAB_SMTP_PORT: ${FORM_LAB_SMTP_PORT:-465}
      FORM_LAB_SMTP_USERNAME: ${FORM_LAB_SMTP_USERNAME:-}
      FORM_LAB_SMTP_PASSWORD: ${FORM_LAB_SMTP_PASSWORD:-}
      FORM_LAB_MAIL_DIRECTORY: /data/mail
    volumes:
      - form-lab-data:/data
volumes:
  form-lab-data:
