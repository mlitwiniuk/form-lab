# Single-host SQLite deployment. Site-specific, non-secret values come from the environment:
#   required: FORM_LAB_SERVER (host IP), FORM_LAB_HOST (public hostname), FORM_LAB_SSH_USER, FORM_LAB_IMAGE,
#             KAMAL_REGISTRY_USERNAME
#   optional: KAMAL_REGISTRY_SERVER (default ghcr.io), FORM_LAB_ARCH (default amd64),
#             FORM_LAB_BUILDER (remote Docker host for builds, e.g. ssh://user@host),
#             FORM_LAB_PROXY_SSL ("false" when a TLS-terminating reverse proxy sits in front; default true)
# Secrets (KAMAL_REGISTRY_PASSWORD and email delivery credentials) are referenced from .kamal/secrets.
service: form-lab
image: <%= ENV.fetch("FORM_LAB_IMAGE") %>
minimum_version: 2.12.0
servers:
  web:
    - <%= ENV.fetch("FORM_LAB_SERVER") %>
proxy:
  host: <%= ENV.fetch("FORM_LAB_HOST") %>
  app_port: 3000
<% if ENV.fetch("FORM_LAB_PROXY_SSL", "true") == "false" %>
  # Behind a reverse proxy that terminates TLS: serve plain HTTP on :80 and pass its X-Forwarded-* headers through.
  ssl: false
  forward_headers: true
<% else %>
  ssl: true
<% end %>
  healthcheck:
    path: /up
  buffering:
    max_request_body: 65536
registry:
  server: <%= ENV.fetch("KAMAL_REGISTRY_SERVER", "ghcr.io") %>
  username: <%= ENV.fetch("KAMAL_REGISTRY_USERNAME") %>
  password:
    - KAMAL_REGISTRY_PASSWORD
builder:
  arch: <%= ENV.fetch("FORM_LAB_ARCH", "amd64") %>
<% if ENV["FORM_LAB_BUILDER"] %>
  # Build on a remote Docker host of the target arch instead of emulating it locally.
  remote: <%= ENV["FORM_LAB_BUILDER"] %>
<% end %>
ssh:
  user: <%= ENV.fetch("FORM_LAB_SSH_USER") %>
env:
  clear:
    FORM_LAB_ORIGIN: https://<%= ENV.fetch("FORM_LAB_HOST") %>
    FORM_LAB_REGISTRATION_ENABLED: <%= ENV.fetch("FORM_LAB_REGISTRATION_ENABLED", "true").inspect %>
    FORM_LAB_MAIL_TRANSPORT: <%= ENV.fetch("FORM_LAB_MAIL_TRANSPORT", "disabled").inspect %>
    FORM_LAB_MAIL_FROM: <%= ENV.fetch("FORM_LAB_MAIL_FROM", "").inspect %>
    FORM_LAB_MAILGUN_REGION: <%= ENV.fetch("FORM_LAB_MAILGUN_REGION", "us").inspect %>
    FORM_LAB_MAILGUN_DOMAIN: <%= ENV.fetch("FORM_LAB_MAILGUN_DOMAIN", "").inspect %>
    FORM_LAB_SMTP_HOST: <%= ENV.fetch("FORM_LAB_SMTP_HOST", "").inspect %>
    FORM_LAB_SMTP_PORT: <%= ENV.fetch("FORM_LAB_SMTP_PORT", "465").inspect %>
  secret:
    - FORM_LAB_MAILGUN_API_KEY
    - FORM_LAB_SMTP_USERNAME
    - FORM_LAB_SMTP_PASSWORD
volumes:
  - form-lab-data:/data
# Vite's hashed assets remain available across rolling application releases.
asset_path: /app/frontend/dist/assets
